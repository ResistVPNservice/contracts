[project]
name = "quantum-contracts"
version = "1.0.0"
description = "QuantumVPN: контракты событий Kafka"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "aiosqlite>=0.20", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true  # зависимости на наши библиотеки — из git по тегу

[tool.hatch.build.targets.wheel]
packages = ["quantum_contracts"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
# RUF001-3: кириллица в строках — это нормально; RUF012: pydantic сам копирует изменяемые дефолты
ignore = ["RUF001", "RUF002", "RUF003", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["quantum_contracts", "quantum_service_kit", "tg_kit", "quantum_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
